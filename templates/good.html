<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Good photos · Photobook Picker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .topbar p { color: #444; }
    a { color: #0645ad; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 10px; min-width: 0; }
    .card img { display: block; width: 100%; height: 220px; object-fit: contain; background: #f5f5f5; border-radius: 8px; }
    .date { margin: 10px 0 6px; font-weight: bold; }
    .path { color: #555; font-size: 13px; overflow-wrap: anywhere; }
    button { margin-top: 10px; padding: 8px 12px; border: 1px solid #bbb; border-radius: 8px; background: white; cursor: pointer; }
    button:hover { background: #f5f5f5; }
    .empty { margin-top: 24px; color: #444; }
  </style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <div>
      <h1>Good photos</h1>
      <p>{{ rows|length }} photo(s), sorted by capture date</p>
    </div>
    <a href="{{ url_for('index') }}">Home</a>
  </div>

  {% if rows %}
    <div class="gallery" id="gallery">
      {% for row in rows %}
        <article class="card" data-image-id="{{ row['id'] }}">
          <img src="{{ url_for('serve_image', image_id=row['id']) }}" alt="{{ row['path'] }}" loading="lazy" />
          <div class="date">{{ row['capture_date'] or 'Aufnahmedatum unbekannt' }}</div>
          <div class="path">{{ row['path'] }}</div>
          <button type="button" class="toggle-btn" data-image-id="{{ row['id'] }}">Mark as not good</button>
        </article>
      {% endfor %}
    </div>
  {% else %}
    <p class="empty">No photos are marked good yet. Mark photos while reviewing them.</p>
  {% endif %}
</main>
<script>
  document.querySelectorAll(".toggle-btn").forEach((button) => {
    button.addEventListener("click", async () => {
      button.disabled = true;
      try {
        const response = await fetch("{{ url_for('toggle_good') }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_id: Number(button.dataset.imageId), good: false })
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "Could not update photo.");
        button.closest(".card").remove();
        const count = document.querySelectorAll(".card").length;
        document.querySelector(".topbar p").textContent = `${count} photo(s), sorted by capture date`;
        if (!count) {
          document.getElementById("gallery")?.remove();
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No photos are marked good yet. Mark photos while reviewing them.";
          document.querySelector(".wrap").append(empty);
        }
      } catch (error) {
        alert(error.message);
        button.disabled = false;
      }
    });
  });
</script>
</body>
</html>
